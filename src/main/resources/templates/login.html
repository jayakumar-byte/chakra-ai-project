<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chakra Encryption - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Soft light background to match other pages */
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-container {
            /* Clean white card with soft shadow */
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            color: #1e293b; /* Dark slate text */
            backdrop-filter: blur(10px);
        }
        h2 {
            /* Professional blue for the title */
            color: #0284c7;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            /* Light border for inputs */
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            background: #ffffff;
            color: #1e293b;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #0ea5e9;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
        input::placeholder { color: #94a3b8; }

        button {
            width: 100%;
            padding: 14px;
            /* Solid blue button */
            background: #0ea5e9;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(14, 165, 233, 0.2);
        }
        button:hover {
            background: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(14, 165, 233, 0.3);
        }
        button:active {
            transform: translateY(0);
        }

        /* Message Styling */
        .error-msg, .success-msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
        }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .success-msg {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #0ea5e9;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
            font-weight: 500;
        }
        a:hover { color: #0284c7; text-decoration: underline; }

        /* Tablet/Mobile optimization */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px 20px;
            }
            h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Chakra Login</h2>

    <div th:if="${loginError}" class="error-msg" th:text="${loginError}"></div>
    <div th:if="${param.logout}" class="success-msg">You have been logged out.</div>
    <div th:if="${param.success}" class="success-msg">Registration Successful! Please Login.</div>

    <form th:action="@{/login}" method="post">
        <input type="email" name="username" placeholder="Email Address" required autocomplete="email">
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <a th:href="@{/register}">Don't have an account? Register here</a>
</div>

</body>
</html>
