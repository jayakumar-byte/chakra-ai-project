<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chakra - Register</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Soft light background for consistency */
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #1e293b; /* Dark slate text */
        }
        .reg-container {
            /* Clean white card with soft shadow */
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        h2 {
            /* Using a solid primary blue for headings */
            color: #0284c7;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 26px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            /* Grey border for clean inputs */
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            background: #ffffff;
            color: #1e293b;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #0ea5e9;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
        input::placeholder { color: #94a3b8; }

        button {
            width: 100%;
            padding: 14px;
            /* Maintaining the green theme for Registration success actions */
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(22, 163, 74, 0.2);
        }
        button:hover {
            background: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(22, 163, 74, 0.3);
        }
        button:active {
            transform: translateY(0);
        }

        /* Error Alert Styling */
        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #fecaca;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        p {
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }

        a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        a:hover { color: #0284c7; text-decoration: underline; }

        /* Mobile optimization */
        @media (max-width: 480px) {
            .reg-container {
                padding: 25px 20px;
            }
            h2 { font-size: 22px; }
            input, button { padding: 12px; }
        }
    </style>
</head>
<body>

<div class="reg-container">
    <h2>Create Account</h2>

    <div th:if="${errorMessage}" class="alert-error">
        <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <input type="text" th:field="*{name}" placeholder="Full Name" required>
        <input type="email" th:field="*{email}" placeholder="Email Address" required autocomplete="email">

        <input type="password" th:field="*{password}" placeholder="Password (Min. 8 characters)" required>

        <button type="submit">Register Now</button>
    </form>

    <p>
        Already have an account? <a th:href="@{/login}">Login</a>
    </p>
</div>

</body>
</html>
